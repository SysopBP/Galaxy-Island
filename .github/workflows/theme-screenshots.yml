name: Capture Galaxy Island themes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/theme-screenshots.yml'
      - 'tools/capture_themes.py'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          disable-animations: true
          script: |
            adb shell wm size 720x1600
            adb shell wm density 280
            adb install --no-incremental app/build/outputs/apk/debug/app-debug.apk
            python3 tools/capture_themes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Galaxy-Island-theme-screenshots
          path: screenshots/*

