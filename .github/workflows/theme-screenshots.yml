# Modified by SysopBP, 2026-10-14: pin workflow dependencies to verified commits.
name: Capture Galaxy Island themes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/theme-screenshots.yml'
      - 'tools/capture_themes.py'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          disable-animations: true
          script: |
            adb shell wm size 720x1600
            adb shell wm density 280
            adb install --no-incremental app/build/outputs/apk/debug/app-debug.apk
            python3 tools/capture_themes.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Galaxy-Island-theme-screenshots
          path: screenshots/*

