name: Full Build Validation

on:
  push:
    branches: [main, dev, experimental-systemui-island-host]
  workflow_dispatch:

concurrency:
  group: galaxy-full-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify full APK parity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -f "$APK"
          SIZE="$(stat -c '%s' "$APK")"
          DEX_COUNT="$(unzip -Z1 "$APK" | awk '/^classes([0-9]+)?\.dex$/ {n++} END {print n+0}')"
          echo "Galaxy Island APK: $APK"
          echo "APK bytes: $SIZE"
          echo "DEX files: $DEX_COUNT"
          # Canonical 0.2.0-beta reference: 63,867,555 bytes / 15 DEX.
          # Keep a tolerance for normal compiler drift while rejecting stripped builds.
          test "$SIZE" -ge 50000000
          test "$DEX_COUNT" -ge 12

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-island-full-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

# Build trigger: full Galaxy Island validation
