name: Build Galaxy Island

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: galaxy-island-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Galaxy Island debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify Galaxy Island artifact identity
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK=$APK"
          ls -lh "$APK"
          sha256sum "$APK"

          BAD="$(unzip -l "$APK" | grep -E '(^|/)(app/d2lock|SamsungLockD2)' || true)"
          if [ -n "$BAD" ]; then
            echo "::error::D2 content detected inside Galaxy Island APK"
            echo "$BAD"
            exit 1
          fi

          if ! unzip -l "$APK" | grep -q 'com/ekoehler/expressivecutout'; then
            echo "::error::Galaxy Island package classes were not found in the APK"
            exit 1
          fi

          echo "Galaxy Island artifact identity check passed."

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Upload Galaxy Island APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Island-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Island-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
