name: Build Galaxy Island

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: galaxy-island-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Galaxy Island debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify Galaxy Island artifact identity and parity metrics
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          echo "APK=$APK"
          ls -lh "$APK"
          echo "APK_BYTES=$(stat -c '%s' "$APK")"
          sha256sum "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | head -20
          echo "$BADGING" | grep -F "package: name='app.cutout.ringpreview'" >/dev/null || {
            echo "::error::Unexpected Galaxy Island application ID"
            exit 1
          }

          echo "DEX files:"
          unzip -l "$APK" | awk '/classes([0-9]+)?\.dex$/ {print $1, $4}'
          echo "Native libraries:"
          unzip -l "$APK" | awk '/lib\/.*\.so$/ {sum += $1; count++} END {print "count=" count+0, "uncompressed_bytes=" sum+0}'
          echo "Assets/resources:"
          unzip -l "$APK" | awk '/assets\// {assets += $1; ac++} /res\// {res += $1; rc++} END {print "assets_count=" ac+0, "assets_bytes=" assets+0; print "res_count=" rc+0, "res_bytes=" res+0}'

          if unzip -p "$APK" 'classes*.dex' 2>/dev/null | strings | grep -F -m1 'Lapp/d2lock/' >/dev/null; then
            echo "::error::D2 package content detected inside Galaxy Island DEX"
            exit 1
          fi

          echo "Galaxy Island artifact identity check passed."

      - name: Export runtime dependency report
        run: ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > app/build/galaxy-island-runtime-dependencies.txt

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Upload Galaxy Island APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Island-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload parity report
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Island-parity-report
          path: app/build/galaxy-island-runtime-dependencies.txt
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Island-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
